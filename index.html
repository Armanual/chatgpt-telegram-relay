<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>Уведомление для Армана</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0d10;
      color: #f5f7fa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 20%, rgba(53, 120, 229, 0.18), transparent 35%),
        radial-gradient(circle at 80% 0%, rgba(91, 33, 182, 0.18), transparent 30%),
        #0b0d10;
    }

    main {
      width: min(680px, 100%);
      border: 1px solid #262b33;
      border-radius: 22px;
      padding: 28px;
      background: rgba(19, 22, 27, 0.94);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.34);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #8ea6c9;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 6vw, 44px);
      line-height: 1.04;
    }

    .hint {
      margin: 14px 0 24px;
      color: #aab2bd;
      line-height: 1.55;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      border: 1px solid #343a45;
      border-radius: 14px;
      padding: 15px 16px;
      background: #0e1116;
      color: #f5f7fa;
      font: inherit;
      line-height: 1.45;
      outline: none;
    }

    textarea:focus {
      border-color: #6ea8fe;
      box-shadow: 0 0 0 3px rgba(110, 168, 254, 0.12);
    }

    button {
      width: 100%;
      margin-top: 16px;
      border: 0;
      border-radius: 14px;
      padding: 15px 18px;
      background: #f5f7fa;
      color: #0b0d10;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover { filter: brightness(0.92); }
    button:disabled { cursor: not-allowed; opacity: 0.45; }

    #status {
      min-height: 24px;
      margin: 14px 0 0;
      color: #aab2bd;
      font-size: 14px;
    }

    .ok { color: #9ae6b4 !important; }
    .bad { color: #feb2b2 !important; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">ChatGPT → Vercel → Telegram</p>
    <h1>Уведомление для Гриши</h1>
    <p class="hint">
      Тестовая страница relay. Кнопка делает обычный POST-запрос к серверной Go-функции Vercel,
      а та отправляет сообщение через Telegram Bot API.
    </p>

    <form action="/api/send" method="post" autocomplete="off" id="relay-form">
      <input type="hidden" name="key" id="relay-key" />

      <label for="text">Текст сообщения</label>
      <textarea id="text" name="text" maxlength="3500" required>✅ Тестовое уведомление от ChatGPT

Если ты это видишь в Telegram — схема ChatGPT → Vercel → Telegram работает.</textarea>

      <button id="send-button" type="submit" disabled>Отправить Арману в Telegram</button>
      <p id="status" class="bad">Нет ключа доступа.</p>
    </form>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const keyFromUrl = params.get('key');

    if (keyFromUrl) {
      sessionStorage.setItem('relay_key', keyFromUrl);
      history.replaceState({}, '', window.location.pathname);
    }

    const relayKey = sessionStorage.getItem('relay_key');
    const keyInput = document.getElementById('relay-key');
    const button = document.getElementById('send-button');
    const status = document.getElementById('status');

    if (relayKey) {
      keyInput.value = relayKey;
      button.disabled = false;
      status.textContent = 'Доступ разрешён. Можно отправлять.';
      status.className = 'ok';
    }
  </script>
</body>
</html>
